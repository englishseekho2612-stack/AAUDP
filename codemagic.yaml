workflows:
  web-production:
    name: Web Production Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 20
    scripts:
      - name: Install dependencies
        script: |
          npm ci || npm install
      - name: Code Quality & Lint
        script: |
          npm run lint
      - name: Build Web Production Assets
        script: |
          npm run build
    artifacts:
      - dist/**

  android-release:
    name: Android Release Build
    max_build_duration: 45
    instance_type: mac_mini_m1
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          npm ci || npm install
      - name: Run Linting
        script: |
          npm run lint
      - name: Compile Web Bundle
        script: |
          npm run build
      - name: Capacitor Android Sync
        script: |
          if [ -d "android" ]; then
            npx cap sync android
          else
            echo "Standard web distribution ready for Android WebView containerization"
          fi
      - name: Build Android Artifacts
        script: |
          if [ -d "android" ]; then
            cd android && ./gradlew assembleRelease bundleRelease
          else
            echo "Skipping direct Gradle step: Android source directory not checked into repo root"
          fi
    artifacts:
      - dist/**
      - android/app/build/outputs/apk/**/*.apk
      - android/app/build/outputs/bundle/**/*.aab
