name: Build Windows Desktop Application

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Package Windows Desktop Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Frontend and Bundled Server
        run: npm run build
        env:
          NODE_ENV: production

      - name: Build Windows Executables (Installer and Portable)
        run: npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executables Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Teaching-Studio-Windows-Installer
          path: |
            dist_electron/*.exe
            dist_electron/*.blockmap
            dist_electron/latest.yml
          if-no-files-found: error
          retention-days: 30
